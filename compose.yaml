name: taichung-youbike

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: youbike
      POSTGRES_USER: youbike_admin
      POSTGRES_PASSWORD: ${YOUBIKE_ADMIN_PASSWORD:?Run ./bin/local to initialize local credentials}
      YOUBIKE_COLLECTOR_PASSWORD: ${YOUBIKE_COLLECTOR_PASSWORD:?Run ./bin/local to initialize local credentials}
      YOUBIKE_READER_PASSWORD: ${YOUBIKE_READER_PASSWORD:?Run ./bin/local to initialize local credentials}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-youbike.sql:ro
      - ./postgres/peak-history.sql:/docker-entrypoint-initdb.d/20-peak-history.sql:ro
      - ./postgres/official-monthly.sql:/docker-entrypoint-initdb.d/30-official-monthly.sql:ro

  collector:
    build: .
    init: true
    environment:
      PGHOST: db
      PGDATABASE: youbike
      PGUSER: youbike_collector
      PGPASSWORD: ${YOUBIKE_COLLECTOR_PASSWORD:?Run ./bin/local to initialize local credentials}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/station-overview.json
      GF_SECURITY_ADMIN_PASSWORD: ${YOUBIKE_GRAFANA_ADMIN_PASSWORD:?Run ./bin/local to initialize local credentials}
      YOUBIKE_READER_PASSWORD: ${YOUBIKE_READER_PASSWORD:?Run ./bin/local to initialize local credentials}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${YOUBIKE_GRAFANA_PORT:-5088}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards/station-overview.json:/var/lib/grafana/dashboards/station-overview.json:ro
      - ./grafana/dashboards/peak-history.json:/var/lib/grafana/dashboards/peak-history.json:ro
      - ./grafana/official-monthly.json:/var/lib/grafana/dashboards/official-monthly.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
